name: Release-plz

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  # Publishes any version in Cargo.toml not yet on crates.io, then tags it and
  # cuts a GitHub release. Publishing authenticates via crates.io Trusted
  # Publishing (an OIDC token exchange — no long-lived registry token); the
  # publisher is registered on crates.io against this repo + workflow file.
  # No-ops on every push except the one merging a release PR.
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gates behind the `release` environment (carry over any protection rules).
    environment: release
    permissions:
      contents: write
      # Required for the crates.io Trusted Publishing OIDC token exchange.
      id-token: write
    steps:
      # Mint a token for the john-carmack-bot GitHub App so tags and the GitHub
      # release are authored by the bot rather than github-actions[bot].
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
      - uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Opens (or updates) the release PR: version bump + CHANGELOG from the commits
  # since the last `v*` tag. Merging that PR is what triggers a release. Waits
  # for the publish above so it never reads crates.io mid-publish and opens a
  # spurious bump PR.
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: release
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # The bot-app token also lets CI run on the release PR (GITHUB_TOKEN-authored
      # PRs deliberately don't trigger workflows).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
      - uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
