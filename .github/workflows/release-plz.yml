name: Release-plz

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  # Publishes any version in Cargo.toml not yet on crates.io, then tags it and
  # cuts a GitHub release. Publishing authenticates via crates.io Trusted
  # Publishing (an OIDC token exchange — no long-lived registry token); the
  # publisher is registered on crates.io against this repo + workflow file.
  # No-ops on every push except the one merging a release PR.
  #
  # Everything runs on the workflow's own GITHUB_TOKEN (repo workflow
  # permissions are read+write): the tag and GitHub release are authored by
  # github-actions[bot], and nothing here hangs off tag or release events, so
  # the token's events-start-no-runs rule costs nothing in this job.
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gates behind the `release` environment (carry over any protection rules).
    environment: release
    permissions:
      contents: write
      # Required for the crates.io Trusted Publishing OIDC token exchange.
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
      - uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Opens (or updates) the release PR: version bump + CHANGELOG from the commits
  # since the last `v*` tag. Merging that PR is what triggers a release. Waits
  # for the publish above so it never reads crates.io mid-publish and opens a
  # spurious bump PR.
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: release
    permissions:
      contents: write
      pull-requests: write
      actions: write # approve the release PR's held CI runs
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
      - uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A GITHUB_TOKEN branch push leaves the release PR's CI runs held in the
      # action_required state (GitHub holds workflow runs for events its own
      # token caused). Approve the held run for the branch tip so the release
      # PR carries a live green gate; held runs for superseded heads are
      # deleted — their commit is gone from the branch and they would only
      # linger pending in the Actions tab. Fail-soft throughout: an unapproved
      # run just means a manual "approve workflows" click before merging.
      - name: Approve the release PR's held CI runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-plz-"))][0].headRefName // empty')
          if [ -z "$branch" ]; then
            echo "no open release-plz PR; nothing to approve"
            exit 0
          fi
          tip=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          approved=""
          for i in 1 2 3; do
            sleep 10
            id=$(gh run list --branch "$branch" --status action_required --limit 10 --json databaseId,headSha \
              --jq ".[] | select(.headSha==\"$tip\") | .databaseId" | head -1)
            if [ -n "$id" ]; then
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/$id/approve" >/dev/null \
                && { approved=1; echo "approved held run $id (tip ${tip:0:7})"; } \
                || echo "::warning::could not approve held run $id (approve manually before merging)"
              break
            fi
          done
          [ -n "$approved" ] || echo "no held run for the branch tip (nothing newly pushed, or it already ran)"
          gh run list --branch "$branch" --status action_required --limit 10 --json databaseId,headSha \
            --jq ".[] | select(.headSha!=\"$tip\") | .databaseId" \
            | while read -r stale; do
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$stale" >/dev/null \
                  && echo "deleted stale held run $stale" \
                  || echo "::warning::could not delete stale held run $stale"
              done
