name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Least privilege for GITHUB_TOKEN: every job only reads the repo. Publishing
# uses crates.io Trusted Publishing (OIDC, in release-plz.yml), not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (test, clippy, fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo test --locked --features specta
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features specta -- -D warnings
      # Ensure the benchmarks keep compiling (don't run timings in CI).
      - run: cargo bench --no-run --locked

  typescript:
    name: TS assignability vs @types/geojson
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      # Regenerate the bindings and fail if they drifted from what's committed.
      - run: cargo run --locked --example export_bindings --features specta
      - run: git diff --exit-code ts/bindings.ts
      # The north star: the generated bindings must be mutually assignable with
      # @types/geojson (both directions), gated by `tsc --noEmit`.
      - working-directory: ts
        run: npm ci
      - working-directory: ts
        run: npx tsc --noEmit
