name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Least privilege for GITHUB_TOKEN: every job only reads the repo. Publishing
# uses crates.io Trusted Publishing (OIDC, in release-plz.yml), not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (test, clippy, fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo test --locked --features specta
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features specta -- -D warnings
      # Ensure the benchmarks keep compiling (don't run timings in CI).
      - run: cargo bench --no-run --locked

  typescript:
    name: TS assignability vs @types/geojson
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      # Regenerate the bindings and fail if they drifted from what's committed.
      - run: cargo run --locked --example export_bindings --features specta
      - run: git diff --exit-code ts/bindings.ts
      # The north star: the generated bindings must be mutually assignable with
      # @types/geojson (both directions), gated by `tsc --noEmit`.
      - working-directory: ts
        run: npm ci
      - working-directory: ts
        run: npx tsc --noEmit

  # The promise across the versions consumers actually resolve: the committed
  # bindings must stay mutually assignable with @types/geojson from the
  # declared floor (7946.0.8, the Feature/FeatureCollection generics era)
  # through latest, plus a non-blocking canary on the next TypeScript
  # compiler. Bindings drift vs the Rust source is gated by the `typescript`
  # job above; this one exercises the committed file, so it needs no cargo.
  assignability-matrix:
    name: assignability @types/geojson@${{ matrix.types }} / tsc ${{ matrix.tsc }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ matrix.canary }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { types: '7946.0.8', tsc: 'locked', canary: false }
          - { types: 'latest', tsc: 'locked', canary: false }
          - { types: 'latest', tsc: 'next', canary: true }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - working-directory: ts
        run: npm ci
      - working-directory: ts
        run: npm install --no-save "@types/geojson@${{ matrix.types }}"
      - if: matrix.tsc != 'locked'
        working-directory: ts
        run: npm install --no-save "typescript@${{ matrix.tsc }}"
      - working-directory: ts
        run: npx tsc --noEmit
