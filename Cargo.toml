[package]
name = "typed-geojson"
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Strongly-typed GeoJSON: Feature<G, P> and FeatureCollection<G, P> with typed geometry and properties, layered over the georust geojson crate."
repository = "https://github.com/johncarmack1984/typed-geojson"
documentation = "https://docs.rs/typed-geojson"
readme = "README.md"
keywords = ["geojson", "geospatial", "serde", "typescript", "geo"]
categories = ["science::geo", "encoding"]
# The TS assignability harness and CI config aren't needed by crate consumers.
exclude = ["/ts", "/.github"]

[features]
# Derive `specta::Type` for every public type, so a Rust function returning a
# typed-geojson value exports to `@types/geojson`-assignable TypeScript.
specta = ["dep:specta"]

[dependencies]
geojson = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", optional = true, features = ["derive", "serde_json"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
specta-typescript = "0.0.13"
specta-serde = "0.0.13"
criterion = "0.8"

[[bench]]
name = "geojson"
harness = false

[[example]]
name = "export_bindings"
required-features = ["specta"]

[package.metadata.docs.rs]
all-features = true

# rc.26 / 0.0.13 are merged on specta main but unpublished (crates.io still serves
# rc.25 / 0.0.12); resolve them from the pinned upstream rev until the release lands,
# then drop this section.
[patch.crates-io]
specta = { git = "https://github.com/specta-rs/specta", rev = "ef21f0544e153b944ff5d1b3afd20472afcf760c" }
specta-serde = { git = "https://github.com/specta-rs/specta", rev = "ef21f0544e153b944ff5d1b3afd20472afcf760c" }
specta-typescript = { git = "https://github.com/specta-rs/specta", rev = "ef21f0544e153b944ff5d1b3afd20472afcf760c" }
